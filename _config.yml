title: "Omar Khursheed"
description: "Personal website of Omar Khursheed, MATS Research Scholar."
theme: jekyll-theme-minimal

github:
  is_project_page: false

# Collections
collections:
  posts:
    output: true
    permalink: /blog/:year/:month/:title/

exclude:
